name: Regenerate static pages

on:
  push:
    branches: [main]
    paths:
      - "data/income-data.json"
      - "scripts/generate_country_pages.py"
      - "scripts/generate_social_card.py"
      - ".github/workflows/regenerate-static-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate production data
        run: python scripts/validate_income_data.py data/income-data.json

      - name: Generate country pages and sitemap
        run: python scripts/generate_country_pages.py

      - name: Install social-card dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate social share card
        run: python scripts/generate_social_card.py

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- countries sitemap.xml social-card.png; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add countries sitemap.xml social-card.png
          git commit -m "Regenerate static country pages"
          git push
