name: Validate and build site
on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop, mobile and accessibility regression
        run: npm run test:browser
      - name: Store browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Store tested static build
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 7
  production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the actual production deployment
        run: node scripts/verify-production.mjs
      - name: Store production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification
          path: test-results/production-verification.json
          retention-days: 30
